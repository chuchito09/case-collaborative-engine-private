
spring:
  application:
    name: case-collaborative-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/case_collaborative_db
    username: postgres
    password: ${DB_PASSWORD:8521}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:case_collaborative_engine_secret_key_super_segura_para_firmar_jwt_tokens_1234567890}
      expiration: 86400000

gemini:
  api-key: ${GEMINI_API_KEY:}