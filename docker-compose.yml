version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: case-db
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: case_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  case-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: case-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/case_db
      - SPRING_DATASOURCE_USERNAME=devuser
      - SPRING_DATASOURCE_PASSWORD=devpassword
      - JWT_SECRET=VerySecretAndLongKeyForProductionEnvironment2026
      - JWT_EXPIRATION=86400000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - postgres-db
    restart: always

volumes:
  postgres-data:
